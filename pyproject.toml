[project]
name = "penguineer"
version = "0.3.0"
description = "Find the root cause of off-spec lots from historian and LIMS exports, offline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "KausalFlow" }]
keywords = ["process industry", "root cause analysis", "historian", "LIMS", "time series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "plantgraph==0.3.0",
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Generates the homeostat bench scenarios. Pinned: a scenario is only reproducible with the
# Homeostat and NumPy versions that made it (uv.lock pins NumPy).
bench = ["homeostat[fast]==0.1.0a3"]
# `penguineer mcp`: every command as a tool for MCP clients (stdio, local only).
mcp = ["mcp>=2.1,<3"]
# `--llm api`: the Anthropic and OpenAI SDKs. `--llm local` needs nothing extra.
llm-api = ["anthropic>=0.40", "openai>=1.50"]
# `penguineer.agent.models`: tool-calling models from any provider, through Pydantic AI.
agent = ["pydantic-ai-slim>=2.56"]

[project.urls]
Documentation = "https://kausalflow.com/penguineer/"
Source = "https://github.com/kausalflow/penguineer"
Issues = "https://github.com/kausalflow/penguineer/issues"

[project.scripts]
penguineer = "penguineer.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penguineer"]

[tool.uv.workspace]
members = ["packages/plantgraph"]

[tool.uv.sources]
plantgraph = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/plantgraph/tests"]
markers = ["homeostat: uses real data downloaded from Homeostat Live"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
