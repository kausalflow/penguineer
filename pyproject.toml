[project]
name = "penguineer"
version = "0.1.0.dev0"
description = "Find the root cause of off-spec lots from historian and LIMS exports, offline"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "KausalFlow" }]
dependencies = [
    "numpy>=1.26",
    "plantgraph",
    "polars>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
penguineer = "penguineer.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penguineer"]

[tool.uv.workspace]
members = ["packages/plantgraph"]

[tool.uv.sources]
plantgraph = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/plantgraph/tests"]
markers = ["homeostat: uses real data downloaded from Homeostat Live"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
