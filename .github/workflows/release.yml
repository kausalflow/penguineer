name: Release

# Publishes penguineer and plantgraph to PyPI when a GitHub release is published.
# The release tag must be v<version>, matching the version of both packages.
# Uses PyPI trusted publishing: no token is stored in the repository. Each project on PyPI
# trusts this repository and this workflow (release.yml), penguineer with the environment
# "pypi" and plantgraph with the environment "pypi-plantgraph".
# To finish a release whose publish step failed part way, run this workflow by hand with the
# release tag: files already on PyPI are skipped.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish again, for example v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Check that the tag matches both package versions
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ref="${INPUT_TAG:-$GITHUB_REF_NAME}"
          tag="${ref#v}"
          for f in pyproject.toml packages/plantgraph/pyproject.toml; do
            v=$(uv run --no-project python -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$f")
            if [ "$v" != "$tag" ]; then
              echo "::error::release tag $ref does not match version $v in $f"
              exit 1
            fi
          done
      - run: uv build --all-packages
      - name: Install the wheels into a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python --find-links dist penguineer
          /tmp/clean/bin/penguineer --version
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # One job per package, each in its own environment, so that each OIDC token matches exactly one
  # PyPI project (a token for a known publisher cannot create a second, new project).
  # plantgraph goes first: penguineer depends on it.
  publish-plantgraph:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-plantgraph
      url: https://pypi.org/project/plantgraph/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mkdir upload && mv dist/plantgraph-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          skip-existing: true

  publish-penguineer:
    needs: publish-plantgraph
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/penguineer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: mkdir upload && mv dist/penguineer-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          skip-existing: true
