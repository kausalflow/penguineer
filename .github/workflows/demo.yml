name: Demo

# The public live demo: every week, runs investigate on the newest off-spec lots of Homeostat Live
# isidis-01 (scripts/investigate_homeostat_live.py) and publishes the summary and the lot reports
# to the gh-pages branch at demo/isidis-01/, served at
# https://kausalflow.com/penguineer/demo/isidis-01/. Only public API data is used.

on:
  schedule:
    - cron: "0 6 * * 6" # Saturdays 06:00 UTC
  workflow_dispatch:
  pull_request:
    # Builds the page without publishing it, as an artifact.
    paths:
      - scripts/build_demo_site.py
      - .github/workflows/demo.yml

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Investigate the last 35 days
        run: |
          since=$(date -u -d "35 days ago" +%Y-%m-%dT%H:00:00+00:00)
          until=$(date -u +%Y-%m-%dT%H:00:00+00:00)
          uv run python scripts/investigate_homeostat_live.py --out out --since "$since" --until "$until"
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - run: uv run --with markdown==3.7 python scripts/build_demo_site.py out demo-site --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo-site/
      - if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: demo-site
          target-folder: demo/isidis-01
          force: false
