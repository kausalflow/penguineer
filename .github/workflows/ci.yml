name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      # Tests on real Homeostat Live data must run in CI, not be skipped.
      PENGUINEER_REQUIRE_HOMEOSTAT: "1"
      PENGUINEER_HOMEOSTAT_CACHE: ${{ github.workspace }}/.homeostat-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # The mcp, llm-api, agent and delta extras, so that the MCP server's, the LLM SDKs', the agent
      # models' and the Delta table tests run too.
      - run: uv sync --locked --extra mcp --extra llm-api --extra agent --extra delta
      - uses: actions/cache@v4
        with:
          path: .homeostat-cache
          # The window is fixed and already released, so its data never changes.
          key: homeostat-isidis-01-20261002T1700-20261009T1700
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Smoke run on the demo plant
        run: |
          cd "$RUNNER_TEMP"
          uv run --project "$GITHUB_WORKSPACE" penguineer data health \
            --data "$GITHUB_WORKSPACE/examples/demo/historian.csv" \
            --graph "$GITHUB_WORKSPACE/examples/demo/graph.yaml"
          uv run --project "$GITHUB_WORKSPACE" penguineer graph check \
            --graph "$GITHUB_WORKSPACE/examples/demo/graph.yaml"
          d="$GITHUB_WORKSPACE/examples/offspec"
          uv run --project "$GITHUB_WORKSPACE" penguineer investigate --lot L0803-A \
            --lims "$d/lims.csv" --data "$d/historian.csv" --graph "$d/graph.yaml" --lots "$d/lots.csv"
      - name: Data health on a released Homeostat Live week
        run: |
          week="$PENGUINEER_HOMEOSTAT_CACHE/isidis-01_20261002T1700_20261009T1700"
          uv run python scripts/fetch_homeostat_live.py --plant isidis-01 \
            --since 2026-10-02T17:00:00+00:00 --until 2026-10-09T17:00:00+00:00 --out "$week"
          cd "$RUNNER_TEMP"
          uv run --project "$GITHUB_WORKSPACE" penguineer data health \
            --data "$week/live.csv" --graph "$week/graph.yaml"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --all-packages
      - name: Install the wheels into a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/penguineer --version
          # Without the mcp extra, `penguineer mcp` says how to get it and exits with code 2.
          code=0; /tmp/clean/bin/penguineer mcp < /dev/null 2> mcp.err || code=$?
          cat mcp.err; test "$code" = 2 && grep -q 'penguineer\[mcp\]' mcp.err
