[project]
name = "plantgraph"
version = "0.1.0.dev0"
description = "Typed plant context graph schema shared by penguineer and homeostat"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "KausalFlow" }]
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantgraph"]
